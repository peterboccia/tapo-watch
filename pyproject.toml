[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tapo-watch"
version = "0.1.0"
description = "Local Tapo motion alerts, snapshots and video clips delivered to Telegram"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "python-dotenv>=1.0,<2",
    "pytapo==3.4.30",
    "onvif-zeep>=0.2.12,<0.3",
    "imageio-ffmpeg>=0.6,<0.7",
    "requests>=2.32,<3",
    "lxml>=4.9,<7",
    "zeep>=4.2,<5",
]

[project.scripts]
tapo-watch = "tapo_camera.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tapo_camera*"]
